[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dc-violations"
version = "0.1.0"
description = "DC moving violations downloader and simple Streamlit visual"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.2",
  "requests>=2.32",
  "plotly>=5.24",
  "streamlit>=1.38",
  "pyarrow>=17.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
